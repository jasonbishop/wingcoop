# The local Qwen MoE on the co-op seed-103 game again, now with full reasoning (plan: true used to switch it
# to brief) and the fixed plan-block parser: the fair comparisons for llm-glm-flash.yaml, without table talk.
#   coop_plan_after_thinking: hidden thinking on as well, as in the GLM game (runs first)
#   coop_plan_after:          full visible reasoning, thinking off
# Thinking needs room: the prompt (~4,000 tokens) plus max_tokens (+600 for the plan) must fit the server's
# context_length, set to 32,768 for this run (with 16,384, max_tokens must stay near 11,000).
# Run it serially:
#   .venv/bin/python -m wingsim.runner wingsim/experiments/llm-qwen-full.yaml --workers 1 --no-report
name: llm-qwen-full
seeds: {start: 103, count: 1}
players: [2]
conditions:
  coop_plan_after_thinking:
    plugins:
      coop_goals: {penalty: avg_x_d, allowed_changes: [0, 1]}
    open_hands: true
    win_condition: team_total
    agents:
    - &qwen
      type: llm
      model: qwen-moe
      base_url: http://10.20.0.71:8000/v1
      reasoning: full
      thinking: high          # the local server has no effort levels; this switches thinking on and is logged
      max_tokens: 16000
      timeout: 1800
      extra_body:
        chat_template_kwargs: {enable_thinking: true}
      prompt: plan
      plan: true
      compact: true
      outcomes: true
    - {type: greedy, weights: tuned/coop.json}
  coop_plan_after:
    plugins:
      coop_goals: {penalty: avg_x_d, allowed_changes: [0, 1]}
    open_hands: true
    win_condition: team_total
    agents:
    - {<<: *qwen, thinking: null, max_tokens: 6000, timeout: 900,
       extra_body: {chat_template_kwargs: {enable_thinking: false}}}
    - {type: greedy, weights: tuned/coop.json}
motivation: [1.0]
group_policy: [fixed(2)]
group_share: [false]
logging: {level: full, snapshots: decision}
