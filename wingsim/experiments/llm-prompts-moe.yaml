# Which prompt features help a language model play? Seat 0 is the model, seat 1 the tuned greedy bot,
# open hands. Three prompts, each under normal (individual) scoring with w = 0 and under the co-op house
# rules with w = 1 (the coop_ conditions). The prompts:
#   default     the current prompt (reasons briefly, then answers)
#   plan        + a written plan carried between turns, notes within the turn, compact payment labels,
#               starting birds chosen by naming them
#   plan_after  + a line per action option saying what it changes right away
# Compare seat 0's score (p0_total) and its margin over the bot (p0_total - p1_total), paired by seed.
# Qwen3.6-35B-A3B (MoE) on the local server, one request at a time (batching ran the Mac out of GPU
# buffers within 20 minutes). Full reasoning ("a few short paragraphs at most"): the model usually writes
# 1000-2200 tokens, so replies get 6000 (6600 with a plan); it ignored "three sentences at most" anyway.
# Run with --workers 1, and --resume after a stop. The brief-prompt games (1500 tokens) are in
# results/llm-prompts-moe-brief.
name: llm-prompts-moe
seeds: {start: 101, count: 5}           # 5 seeds first; raise to 10 if the results warrant it
players: [2]
conditions:
  default:
    plugins: {}
    open_hands: true
    agents:
      - &qwen {type: llm, model: qwen-moe, base_url: "http://10.20.0.86:8000/v1", reasoning: full, max_tokens: 6000,
               timeout: 900, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
      - {type: greedy, weights: "tuned/baseline.json"}
  plan:
    plugins: {}
    open_hands: true
    agents:
      - {<<: *qwen, prompt: plan, plan: true, compact: true}
      - {type: greedy, weights: "tuned/baseline.json"}
  plan_after:
    plugins: {}
    open_hands: true
    agents:
      - {<<: *qwen, prompt: plan, plan: true, compact: true, outcomes: true}
      - {type: greedy, weights: "tuned/baseline.json"}
  # The same three prompts under the co-op house rules: co-op round goals, team-total scoring, every player
  # told to maximize the team total (w = 1), group goal set by fixed(2), the bot on its co-op weights.
  coop_default:
    plugins: {coop_goals: {penalty: avg_x_d, allowed_changes: [0, 1]}}
    open_hands: true
    win_condition: team_total
    motivation: [1.0]
    agents:
      - *qwen
      - {type: greedy, weights: "tuned/coop.json"}
  coop_plan:
    plugins: {coop_goals: {penalty: avg_x_d, allowed_changes: [0, 1]}}
    open_hands: true
    win_condition: team_total
    motivation: [1.0]
    agents:
      - {<<: *qwen, prompt: plan, plan: true, compact: true}
      - {type: greedy, weights: "tuned/coop.json"}
  coop_plan_after:
    plugins: {coop_goals: {penalty: avg_x_d, allowed_changes: [0, 1]}}
    open_hands: true
    win_condition: team_total
    motivation: [1.0]
    agents:
      - {<<: *qwen, prompt: plan, plan: true, compact: true, outcomes: true}
      - {type: greedy, weights: "tuned/coop.json"}
motivation:  [0.0]                    # the individual-scoring conditions; the co-op ones set their own
group_policy: ["fixed(2)"]
group_share: [false]
logging:     {level: full, snapshots: decision}
