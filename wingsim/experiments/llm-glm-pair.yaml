# Both seats GLM-5.3 Flash (full reasoning, high thinking) on the co-op seed-103 game: does a team of two
# language models do better than one with a greedy partner (llm-glm-flash.yaml)? They see each other's hands
# but cannot talk or share a plan. budget_usd counts both seats together (~$0.75 a game). Run it with:
#   .venv/bin/python -m wingsim.runner wingsim/experiments/llm-glm-pair.yaml --workers 1 --no-report
name: llm-glm-pair
seeds: {start: 103, count: 1}
players: [2]
conditions:
  coop_plan_after:
    plugins:
      coop_goals:
        penalty: avg_x_d
        allowed_changes: [0, 1]
    open_hands: true
    win_condition: team_total
    agents:
    - {type: llm, model: z-ai/glm-5.3-flash, reasoning: full, thinking: high, max_tokens: 16000, timeout: 900, budget_usd: 1.5,
      prompt: plan, plan: true, compact: true, outcomes: true}
    - {type: llm, model: z-ai/glm-5.3-flash, reasoning: full, thinking: high, max_tokens: 16000, timeout: 900, budget_usd: 1.5,
      prompt: plan, plan: true, compact: true, outcomes: true}
motivation: [1.0]
group_policy: [fixed(2)]
group_share: [false]
logging: {level: full, snapshots: decision}
